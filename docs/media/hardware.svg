<text x="44" y="647" fill="#627667" font-size="15">Functional illustration, not a pin-accurate schematic or mechanical drawing. Check the board documentation.</text><text x="44" y="678" fill="#627667" font-size="15">*Use the board’s specified input and programming USB port. Tested defaults: pre-v3 P4 silicon. Enclosure CAD is not included.</text>
