<title id="title">FlowCount hardware map</title><desc id="desc">Functional illustration of GUITION JC-ESP32P4-M3-DEV, IMX219 CSI camera, P4 compute and onboard C6 connectivity. Camera I2C GPIO7/8. C6 SDIO CLK18 CMD19 D0-3 14-17 reset54. Not a mechanical drawing or pin-accurate schematic.</desc>
