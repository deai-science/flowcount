<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">FlowCount architecture</title><desc id="desc">IMX219 capture enters the ESP32-P4 ISP, pedestrian detector, tracker and counter. The P4 stores totals in NVS and serves its UI through ESP32-C6 Wi-Fi. A browser is optional for viewing and setup.</desc>
