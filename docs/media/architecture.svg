<g fill="#627667" font-size="16"><text x="63" y="285">1640 × 1232 RAW10</text><text x="63" y="313">30 fps sensor mode</text><text x="63" y="341">MIPI CSI · 2 lanes</text><text x="348" y="285">RGB565 frames</text><text x="348" y="313">Downsample</text><text x="348" y="341">320 × 240 in RAM</text><text x="561" y="285">PICO_S8_V1</text><text x="561" y="313">224 × 224 internally</text><text x="561" y="341">Person boxes</text><text x="774" y="285">Hungarian matching</text><text x="774" y="313">Confirmed sides</text><text x="774" y="341">Entry / exit events</text><text x="348" y="480">Totals · settings · credentials</text><text x="688" y="480">UI · API · frame-bound metadata</text><text x="1040" y="285">Wi-Fi over SDIO</text><text x="1040" y="313">Venue network</text><text x="1040" y="341">+ recovery AP</text><text x="1040" y="480">Local browser · setup + view</text></g>
