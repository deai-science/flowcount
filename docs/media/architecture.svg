<rect width="1280" height="720" rx="24" fill="#f2f5ef"/>
<g font-family="Arial, sans-serif"><text x="42" y="56" font-size="14" font-weight="700" fill="#627667" letter-spacing="2">FLOWCOUNT / FIRMWARE &amp; DATA FLOW</text><text x="42" y="103" font-size="32" font-weight="700" fill="#173d30">The intelligence stays on the P4.</text>
<rect x="304" y="147" width="665" height="396" rx="24" fill="#e0eddf" stroke="#a9c4ae"/>
<text x="328" y="182" font-size="17" font-weight="700" fill="#175c45">ESP32-P4 · 360 MHz · 32 MB PSRAM</text>
